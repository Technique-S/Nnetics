name: Guarded payment core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payment-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official tag
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang cmake
      - name: Install pinned Rust
        run: rustup show
      - name: Build and test local sandbox only
        run: bash scripts/check-core.sh
      - name: Retain logs, checksums and public sandbox receipt proofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payment-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runs/
          if-no-files-found: warn
          retention-days: 14
