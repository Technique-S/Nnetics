name: Vault provisioning review
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provisioning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sandbox_version: ["2.13.0", "2.14.0-rc.5"]
    env:
      NNETICS_SANDBOX_VERSION: ${{ matrix.sandbox_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang cmake
      - name: Run existing core and new provisioning suites
        run: bash scripts/check-provisioning.sh
      - name: Retain logs and new artifacts for review; never deploy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provisioning-${{ github.run_id }}-${{ matrix.sandbox_version }}
          path: |
            artifacts/runs/
            artifacts/provisioning/
          retention-days: 14
