[package]
name = "nnetics-vault-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }

# Separate sandbox artifacts only; never deploy these feature builds.
[features]
fault-init-args = []
fault-created-callback = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
