[package]
name = "nnetics-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
anyhow = "=1.0.100"
near-workspaces = "=0.23.0"
# Pin the node to nearcore 2.13.0 / protocol 86, compatible with SDK 5.29.1 (minimum 84).
near-sandbox = "=0.3.12"
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time"] }
near-primitives = "=0.37.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
nnetics-vault = { path = "../vault" }
near-sdk = { version = "=5.29.1", features = ["unit-testing", "legacy"] }
near-sdk-env = "=0.1.6"
near-sys = "=0.2.14"
ed25519-dalek = "=2.2.0"
