[package]
name = "nnetics-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy", "unit-testing"] }
ed25519-dalek = "=2.2.0"
near-primitives = "=0.37.4"

# Fault injection is exclusively for separate sandbox artifacts. Never deploy these.
[features]
fault-record-gas = []
fault-record-storage = []
fault-finalize-gas = []
fault-finalize-storage = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
